[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "payclause"
version = "0.1.0"
description = "Local payment-clause chase calendar for solo freelancers."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Mourad.Soltani"}]
license = {text = "MIT"}

[project.scripts]
payclause = "payclause.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
